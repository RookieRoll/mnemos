name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # CI tests the toolchain floor declared in go.mod (Go 1.27).
        # When the floor moves, move this matrix with it.
        go: ["1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      # -race needs cgo. Release binaries are still built with
      # CGO_ENABLED=0; this only affects the test run.
      - name: Test
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every distribution manifest must be valid JSON.
      - name: Manifests parse
        run: |
          for f in plugin.json .claude-plugin/plugin.json \
                   .claude-plugin/marketplace.json marketplace.extended.json pi/package.json; do
            jq . "$f" > /dev/null
          done
      # The Claude Code plugin loader reads .claude-plugin/plugin.json while
      # the tonsofskills validator and the documented jq checks read the
      # root copy. They must stay byte-identical so a version bump to one
      # can't leave the other stale.
      - name: Plugin manifests in sync
        run: diff plugin.json .claude-plugin/plugin.json

      - name: Distribution versions agree
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = json.loads(Path("plugin.json").read_text(encoding="utf-8"))["version"]
          versions = {}
          for name in ("plugin.json", ".claude-plugin/plugin.json", "marketplace.extended.json", "pi/package.json"):
              versions[name] = json.loads(Path(name).read_text(encoding="utf-8"))["version"]
          marketplace = json.loads(Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          entries = [p for p in marketplace["plugins"] if p["name"] == "mnemos"]
          if len(entries) != 1:
              raise SystemExit("marketplace must contain exactly one mnemos entry")
          versions[".claude-plugin/marketplace.json"] = entries[0]["version"]
          for name in (".claude/skills/mnemos/SKILL.md", ".agents/skills/mnemos/SKILL.md", "pi/skills/mnemos/SKILL.md"):
              text = Path(name).read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"{name}: missing YAML frontmatter")
              frontmatter = text.split("---", 2)[1]
              found = re.findall(r"^version:\s*(\S+)\s*$", frontmatter, re.MULTILINE)
              if len(found) != 1:
                  raise SystemExit(f"{name}: expected one frontmatter version")
              versions[name] = found[0]
          mismatches = {name: version for name, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f"version mismatch; expected {expected}: {mismatches}")
          print(f"{len(versions)} distribution versions agree at {expected}")
          PY
